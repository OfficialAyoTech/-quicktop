<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>QuickTop Admin</title>
<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--surface2:#1A2235;
  --accent:#00E676;--accent2:#00BFA5;--text:#F0F4FF;--text2:#8A93A8;
  --danger:#FF5370;--warn:#FFC107;--radius:16px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.hidden{display:none !important;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;}
.login-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.35);color:var(--warn);font-size:11px;font-weight:700;letter-spacing:.5px;padding:5px 10px;border-radius:20px;margin-bottom:18px;}
.login-title{font-size:26px;font-weight:800;margin-bottom:4px;}
.login-sub{color:var(--text2);font-size:14px;margin-bottom:28px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600;}
input{width:100%;background:var(--surface);border:1.5px solid var(--surface2);border-radius:var(--radius-sm);padding:13px 16px;color:var(--text);font-size:15px;outline:none;transition:border .2s;font-family:inherit;}
input:focus{border-color:var(--accent);}
.btn-primary{width:100%;background:var(--accent);color:#0A0F1E;border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s;}
.btn-primary:disabled{opacity:.5;cursor:default;}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

/* DASHBOARD */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--surface2);position:sticky;top:0;z-index:10;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-logo{font-weight:800;font-size:17px;}
.topbar-logo span{color:var(--accent);}
.topbar-badge{background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.35);color:var(--warn);font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.admin-email{font-size:13px;color:var(--text2);}
.logout-link{color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;}

.dash-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
.dash-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.dash-sub{color:var(--text2);font-size:14px;margin-bottom:24px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.stat-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:20px;}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;}
.stat-value{font-size:26px;font-weight:800;line-height:1;}
.stat-label{color:var(--text2);font-size:13px;margin-top:6px;}

.stat-card.users .stat-icon{background:rgba(0,230,118,.12);}
.stat-card.active .stat-icon{background:rgba(0,191,165,.12);}
.stat-card.pending .stat-icon{background:rgba(255,193,7,.12);}
.stat-card.verified .stat-icon{background:rgba(0,230,118,.12);}
.stat-card.balance .stat-icon{background:rgba(0,230,118,.12);}
.stat-card.tx .stat-icon{background:rgba(138,147,168,.15);}
.stat-card.today .stat-icon{background:rgba(0,191,165,.12);}

.stat-card.pending .stat-value{color:var(--warn);}

.dash-loading{text-align:center;color:var(--text2);padding:60px 0;font-size:14px;}
.dash-error{text-align:center;color:var(--danger);padding:60px 20px;font-size:14px;}

@media(max-width:480px){
  .topbar{padding:14px 16px;}
  .admin-email{display:none;}
  .dash-wrap{padding:20px 16px 40px;}
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader" class="dash-loading">Loading...</div>

<!-- LOGIN -->
<div class="login-wrap hidden" id="loginScreen">
  <div class="login-card">
    <div class="login-badge">🔒 RESTRICTED ACCESS</div>
    <div class="login-title">QuickTop Admin</div>
    <div class="login-sub">Sign in with your administrator account.</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@quicktop.com" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doAdminLogin()">Sign In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">Quick<span>Top</span> Admin</div>
      <div class="topbar-badge">STAFF ONLY</div>
    </div>
    <div class="topbar-right">
      <div class="admin-email" id="adminEmailLabel"></div>
      <button class="logout-link" onclick="doAdminLogout()">Log Out</button>
    </div>
  </div>

  <div class="dash-wrap">
    <div class="dash-title">Dashboard</div>
    <div class="dash-sub">Platform overview, updated live from your backend.</div>

    <div id="dashContent">
      <div class="dash-loading">Loading dashboard...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyAsmztl_Gth5FpH68OCClpDoTXDWlCk11U",
  authDomain:"quicktop-8eb22.firebaseapp.com",
  projectId:"quicktop-8eb22",
  storageBucket:"quicktop-8eb22.firebasestorage.app",
  messagingSenderId:"1079372854323",
  appId:"1:1079372854323:web:a09fd674616465192d9f46"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const BACKEND = 'https://quicktop-backend-8aon.onrender.com';

function byId(id){ return document.getElementById(id); }
function show(id){ byId(id).classList.remove('hidden'); }
function hide(id){ byId(id).classList.add('hidden'); }
function val(id){ return (byId(id)?.value||'').trim(); }
function fmt(n){ return Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function api(path, options = {}){
  const user = auth.currentUser;
  if(!user) throw new Error("Not signed in");
  const token = await user.getIdToken();
  return fetch(`${BACKEND}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`,
      ...(options.headers || {})
    }
  });
}

window.doAdminLogin = async function(){
  const email = val('loginEmail');
  const pass = val('loginPass');
  byId('loginErr').textContent = '';
  if(!email || !pass){ byId('loginErr').textContent = 'Enter email and password'; return; }

  const btn = byId('loginBtn');
  btn.textContent = 'Signing in...'; btn.disabled = true;

  try{
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged below handles the role check and screen switch
  }catch(e){
    byId('loginErr').textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password' : e.message;
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

window.doAdminLogout = async function(){
  await signOut(auth);
  hide('dashboardScreen');
  byId('loginBtn').textContent = 'Sign In'; byId('loginBtn').disabled = false;
  byId('loginEmail').value = ''; byId('loginPass').value = '';
  show('loginScreen');
}

async function loadDashboard(){
  const wrap = byId('dashContent');
  wrap.innerHTML = '<div class="dash-loading">Loading dashboard...</div>';

  try{
    const res = await api('/api/admin/dashboard');

    if(res.status === 403){
      throw { adminDenied: true };
    }

    const data = await res.json();
    if(!data.success){
      wrap.innerHTML = `<div class="dash-error">Could not load dashboard: ${data.message || 'Unknown error'}</div>`;
      return;
    }

    const s = data.data;
    const cards = [
      { cls:'users',    icon:'👥', value: s.total_users,          label:'Total Users' },
      { cls:'active',   icon:'✅', value: s.active_users,         label:'Active Users' },
      { cls:'pending',  icon:'⏳', value: s.pending_kyc,          label:'Pending KYC' },
      { cls:'verified', icon:'🛡️', value: s.verified_kyc,         label:'Verified KYC' },
      { cls:'balance',  icon:'💰', value: '₦'+fmt(s.total_wallet_balance), label:'Total Wallet Balance' },
      { cls:'tx',       icon:'📊', value: s.total_transactions,   label:'Total Transactions' },
      { cls:'today',    icon:'📅', value: s.today_transactions,   label:"Today's Transactions" }
    ];

    wrap.innerHTML = `<div class="stat-grid">${cards.map(c => `
      <div class="stat-card ${c.cls}">
        <div class="stat-icon">${c.icon}</div>
        <div class="stat-value">${c.value ?? 0}</div>
        <div class="stat-label">${c.label}</div>
      </div>
    `).join('')}</div>`;

  }catch(e){
    if(e && e.adminDenied) throw e;
    wrap.innerHTML = '<div class="dash-error">Network error — could not reach the server.</div>';
  }
}

onAuthStateChanged(auth, async (user) => {
  hide('loader');

  if(!user){
    hide('dashboardScreen');
    show('loginScreen');
    return;
  }

  try{
    hide('loginScreen');
    byId('adminEmailLabel').textContent = user.email;
    show('dashboardScreen');
    await loadDashboard();
  }catch(e){
    if(e && e.adminDenied){
      hide('dashboardScreen');
      await signOut(auth);
      show('loginScreen');
      byId('loginErr').textContent = 'This account does not have admin access.';
    } else {
      console.error(e);
    }
  }
});
</script>
</body>
</html>
